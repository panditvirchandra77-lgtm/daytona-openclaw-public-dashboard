<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Config Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1f29; color: #c9d1d9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 24px; }
        .tab { background: #30363d; border-radius: 8px; margin-bottom: 15px; }
        .tab.active { background: #21262d; }
        .tab-button { width: 100%; padding: 15px 20px; border: none; border-radius: 8px; color: #c9d1d9; background: transparent; cursor: pointer; font-size: 16px; text-align: left; }
        .tab-button:hover { color: #58a6ff; }
        .tab-pane { padding: 20px; display: none; }
        .tab-pane.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b949e; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #454b54; background: #161b22; color: #c9d1d9; font-size: 14px; }
        input:focus { outline: none; border-color: #58a6ff; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; margin-right: 10px; }
        .btn-primary { background: #388bfd; color: white; }
        .btn-success { background: #3fb950; color: white; }
        .btn:hover { opacity: 0.9; }
        .info-box { background: #21262d; border-radius: 8px; padding: 15px; margin-top: 10px; }
        .info-label { color: #8b949e; font-size: 12px; }
        .info-value { color: #58a6ff; font-family: monospace; word-break: break-all; }
        .status-item { margin-bottom: 10px; }
        .status-item:last-child { margin-bottom: 0; }
        .reload-btn { background: #6e7681; color: white; }
        .form-hint { color: #6e7681; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Provider Config Dashboard</h1>
        
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('providers')">Providers</button>
            <button class="tab-button" onclick="showTab('terminal')">Terminal</button>
            <button class="tab-button" onclick="showTab('status')">Status</button>
        </div>

        <!-- Providers Tab -->
        <div id="providers-tab" class="tab-pane active">
            <div class="form-group">
                <label for="baseUrl">Provider Base URL</label>
                <input type="text" id="baseUrl" placeholder="https://api.example.com/v1">
                <div class="form-hint">Base URL for the provider API</div>
            </div>
            
            <div class="form-group">
                <label for="model">Model ID</label>
                <input type="text" id="model" placeholder="provider/model-name">
                <div class="form-hint">Full model identifier (e.g., openrouter/stealth/space-bunny-alpha)</div>
            </div>
            
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
                <div class="form-hint">Stored securely in secrets, never in config</div>
            </div>
            
            <button class="btn btn-primary" onclick="addProvider()">Add Provider</button>
            <button class="btn btn-success" onclick="testConnection()">Test Connection</button>
            
            <div id="result-message" style="margin-top: 15px;"></div>
        </div>

        <!-- Terminal Tab -->
        <div id="terminal-tab" class="tab-pane">
            <div id="terminal-container" style="background: #161b22; border-radius: 6px; height: 400px; display: flex; align-items: center; justify-content: center;">
                <p style="color: #6e7681;">Terminal widget will appear here</p>
            </div>
            <button class="btn btn-primary" style="margin-top: 15px;" onclick="refreshTerminal()">Refresh Terminal</button>
        </div>

        <!-- Status Tab -->
        <div id="status-tab" class="tab-pane">
            <div class="status-item">
                <span class="info-label">Current Model:</span>
                <span id="current-model" class="info-value">Loading...</span>
            </div>
            <div class="status-item">
                <span class="info-label">Configured Providers:</span>
                <span id="providers-count" class="info-value">Loading...</span>
            </div>
            <div class="status-item">
                <span class="info-label">Gateway Status:</span>
                <span id="gateway-status" class="info-value">Connecting...</span>
            </div>
            <button class="btn reload-btn" onclick="loadStatus()">Refresh Status</button>
        </div>
    </div>

    <script>
        let currentProvider = null;
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            document.querySelector('.tab-button[onclick="showTab(\'' + tabName + '\')"]').classList.add('active');
            
            if (tabName === 'status') loadStatus();
        }
        
        async function addProvider() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const model = document.getElementById('model').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!baseUrl || !model || !apiKey) {
                showResult('All fields are required', true);
                return;
            }
            
            const providerId = model.split('/')[0];
            
            try {
                // Store API key in secrets
                const secretName = `${providerId.toUpperCase()}_API_KEY`.replace(/[^A-Z0-9_]/g, '_');
                await fetch('/api/secrets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: secretName, value: apiKey })
                });
                
                // Update openclaw.json with model config
                const config = {
                    provider: {
                        id: providerId,
                        baseUrl,
                        apiKeyName: secretName
                    },
                    model,
                    addedAt: new Date().toISOString()
                };
                
                await fetch('/api/config/providers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                
                showResult('Provider added successfully!\nBase: ' + baseUrl + '\nModel: ' + model, false);
                currentProvider = config;
                document.getElementById('baseUrl').value = '';
                document.getElementById('model').value = '';
                document.getElementById('apiKey').value = '';
                loadStatus();
            } catch (error) {
                showResult('Error adding provider: ' + error.message, true);
            }
        }
        
        async function testConnection() {
            const model = document.getElementById('model').value.trim() || 'vyce/deepseek-v4-flash';
            try {
                const response = await fetch('https://api.openai.com/v1/models/' + encodeURIComponent(model), {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer test' }
                });
                showResult('Model endpoint reachable (status: ' + response.status + ')', response.status !== 401);
            } catch (error) {
                showResult('Connection test: ' + error.message, true);
            }
        }
        
        function showResult(message, isError) {
            const el = document.getElementById('result-message');
            el.innerHTML = '<div class="info-box"><strong>' + (isError ? 'Error' : 'Success') + ':</strong><br><pre>' + message + '</pre></div>';
        }
        
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('current-model').textContent = data.model || 'unknown';
                document.getElementById('providers-count').textContent = Object.keys(data.providers || {}).length;
                document.getElementById('gateway-status').textContent = data.ready ? 'Connected' : 'Connecting...';
            } catch (error) {
                document.getElementById('current-model').textContent = 'Unable to load - ' + error.message;
                document.getElementById('providers-count').textContent = 'N/A';
                document.getElementById('gateway-status').textContent = 'Error';
            }
        }
        
        // Load status on init
        loadStatus();
    </script>
</body>
</html>
